<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terraform build viewer (simple)</title>
<style>
  /* Colours are tokens so light and dark mode only change the values. */
  :root {
    --bg: #f4f4f4; --panel: #ffffff; --ink: #161616; --muted: #6f6f6f; --line: #8d8d8d;
    --net: #0f62fe;  /* network: VPC, subnet, gateway */
    --sec: #8a3ffc;  /* security group + rules */
    --cmp: #007d79;  /* servers + public IPs */
    --key: #d02670;  /* SSH key */
    --ext: #198038;  /* existing things we only look up */
    --on: #ffffff;   /* text and icons drawn on a filled piece */
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161616; --panel: #262626; --ink: #f4f4f4; --muted: #a8a8a8; --line: #6f6f6f;
      --net: #4589ff; --sec: #a56eff; --cmp: #08bdba; --key: #ff7eb6; --ext: #42be65;
      --on: #161616;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.4 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 24px 16px 40px; }
  .panel { background: var(--panel); border: 1px solid color-mix(in srgb, var(--line) 35%, transparent);
           border-radius: 8px; padding: 18px 20px 14px; }
  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; }
  .count { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .count b { color: var(--ink); font-size: 16px; }
  .bar { height: 6px; background: color-mix(in srgb, var(--line) 25%, transparent); border-radius: 3px;
         margin: 10px 0 14px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--net); transition: width .5s ease; }
  .controls { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; font-size: 13px; }
  .controls label { color: var(--muted); }
  select, button { font: inherit; color: var(--ink); background: var(--bg); padding: 4px 8px;
                   border: 1px solid var(--line); border-radius: 4px; }
  button { cursor: pointer; }
  .status { margin-left: auto; color: var(--muted); font-size: 12px; }
  .status::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%;
                    background: var(--line); margin-right: 6px; }
  .status.live::before { background: var(--ext); }
  .status.bad::before { background: #da1e28; }
  svg { width: 100%; height: auto; display: block; }

  /* ---- pieces ---- */
  .piece { --c: var(--net); }
  .piece text { font-family: inherit; fill: var(--muted); transition: fill .4s; }
  .piece .t { font-size: 13px; font-weight: 600; }
  .piece .s { font-size: 10.5px; font-family: ui-monospace, "IBM Plex Mono", Menlo, monospace; }
  .piece .gl { fill: none; stroke: var(--muted); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
               transition: stroke .4s; }
  /* NOT BUILT YET: dashed outline, no fill. */
  .piece .card, .piece .box { fill: transparent; stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 5 4;
                              transition: fill .5s, stroke .5s, fill-opacity .5s; }
  /* BUILT: solid colour. Cards fill completely, container boxes get a light tint. */
  .piece.built .card { fill: var(--c); stroke: var(--c); stroke-dasharray: 0; }
  .piece.built .card ~ text { fill: var(--on); }
  .piece.built .card ~ .gl { stroke: var(--on); }
  .piece.built .box { fill: var(--c); fill-opacity: .08; stroke: var(--c); stroke-dasharray: 0; }
  .piece.built .box ~ .t { fill: var(--c); }
  .piece.built .box ~ .gl { stroke: var(--c); }
  .link { stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 3 4; fill: none; }
  /* A short pulse when a piece first fills in. */
  @keyframes pop { 0% { transform: scale(.94); } 60% { transform: scale(1.03); } 100% { transform: scale(1); } }
  .piece.pop > rect { transform-box: fill-box; transform-origin: center; animation: pop .6s ease-out; }
  @media (prefers-reduced-motion: reduce) { .piece.pop > rect { animation: none; } .bar > i { transition: none; } }

  .legend { display: flex; gap: 22px; align-items: center; margin-top: 12px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .sw { display: inline-block; width: 22px; height: 14px; border-radius: 3px; vertical-align: -2px; margin-right: 6px; }
  .sw.on { background: var(--net); }
  .sw.off { border: 1.5px dashed var(--line); }
  .note { margin-top: 10px; font-size: 12px; color: var(--muted); }
  code { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <div class="head">
      <h1>Your architecture · simple view</h1>
      <div class="count"><b id="built">0</b> of <span id="total">0</span> built</div>
    </div>
    <div class="bar"><i id="barfill"></i></div>

    <div class="controls">
      <label>Version
        <select id="version"><option value="plain">plain</option><option value="modules">modules</option></select>
      </label>
      <label>Workspace <select id="workspace"><option value="default">default</option></select></label>
      <button id="loadbtn" type="button">Load a state file…</button>
      <input id="file" type="file" accept=".tfstate,.json" hidden>
      <span class="status" id="status">connecting…</span>
    </div>

    <svg id="diagram" viewBox="0 0 940 540" role="img" aria-label="Architecture diagram that fills in as Terraform builds it"></svg>

    <div class="legend">
      <span><i class="sw on"></i>built</span>
      <span><i class="sw off"></i>not yet</span>
      <span>Green outline = already existed, only looked up</span>
    </div>
    <div class="note">Simple view: one subnet, fixed layout (<a href="/dynamic">dynamic view</a>). Terraform saves its state about every 20 seconds while applying, so pieces appear in small groups.</div>
  </div>
</div>

<script>
/* ==========================================================================
   How this page works
   1. Every 1.5 s it asks the local server for a SUMMARY of the state file:
      a list like [{type: "ibm_is_vpc", name: "ll-demo-vpc"}, ...].
   2. It has a fixed list of "slots" (the pieces we expect). A slot is "built"
      when the state holds enough resources of that type to cover it.
   3. Built slots get their colour. Raise instance_count and the extra servers
      show up as new outlines. Destroy and the pieces drain back to outlines.
   ========================================================================== */
const NS = 'http://www.w3.org/2000/svg';
const $ = (sel) => document.querySelector(sel);

/* Small line icons, drawn on a 24x24 grid. */
const GLYPHS = {
  vpc:     '<circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8 7l3 9M16 7l-3 9M8.5 6h7"/>',
  gateway: '<path d="M4 12h11M11 7l5 5-5 5M20 5v14"/>',
  subnet:  '<rect x="4" y="4" width="7" height="7"/><rect x="13" y="4" width="7" height="7"/><rect x="4" y="13" width="7" height="7"/><rect x="13" y="13" width="7" height="7"/>',
  shield:  '<path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/>',
  server:  '<rect x="4" y="4" width="16" height="6" rx="1"/><rect x="4" y="14" width="16" height="6" rx="1"/><path d="M8 7h.01M8 17h.01"/>',
  globe:   '<circle cx="12" cy="12" r="8"/><path d="M4 12h16M12 4c3 3 3 13 0 16M12 4c-3 3-3 13 0 16"/>',
  key:     '<circle cx="8" cy="12" r="3.5"/><path d="M11.5 12H21M17 12v3M20 12v2"/>',
  folder:  '<path d="M3 7h6l2 2h10v10H3z"/>',
};

/* The pieces, positioned on a 940 x 540 canvas. n = number of servers. */
function layout(n) {
  const defs = [];
  const box  = (id, type, x, y, w, h, color, glyph, title, i = 0) =>
    defs.push({ id, type, i, kind: 'box', x, y, w, h, color, glyph, title });
  const card = (id, type, x, y, w, h, color, glyph, title, mode = 'tall', i = 0) =>
    defs.push({ id, type, i, kind: 'card', x, y, w, h, color, glyph, title, mode });

  box('rg', 'ibm_resource_group', 10, 10, 920, 520, '--ext', 'folder', 'Resource group');
  card('ssh', 'ibm_is_ssh_key', 40, 110, 120, 88, '--key', 'key', 'SSH key');
  box('vpc', 'ibm_is_vpc', 180, 60, 730, 450, '--net', 'vpc', 'VPC');
  card('pgw', 'ibm_is_public_gateway', 210, 124, 200, 64, '--net', 'gateway', 'Public gateway', 'wide');
  box('sg', 'ibm_is_security_group', 210, 220, 200, 270, '--sec', 'shield', 'Security group');
  [['SSH in · 22', 284], ['Ping in', 338], ['All out', 392]].forEach(([label, y], i) =>
    card('rule' + i, 'ibm_is_security_group_rule', 226, y, 168, 44, '--sec', null, label, 'chip', i));
  box('subnet', 'ibm_is_subnet', 450, 100, 440, 390, '--net', 'subnet', 'Subnet');

  // Servers sit side by side inside the subnet, each with a public IP below it.
  const gap = 20, cw = Math.max(60, Math.min(170, (400 - gap * (n - 1)) / n));
  const x0 = 450 + (440 - (n * cw + (n - 1) * gap)) / 2;
  for (let i = 0; i < n; i++) {
    const x = x0 + i * (cw + gap);
    card('vsi' + i, 'ibm_is_instance', x, 170, cw, 120, '--cmp', 'server', 'Server ' + (i + 1), 'tall', i);
    card('fip' + i, 'ibm_is_floating_ip', x, 322, cw, 64, '--cmp', 'globe', 'Public IP', 'wide', i);
  }
  return defs;
}

/* Things we only look up (data sources) but still draw as pieces. */
const LOOKUP_TYPES = new Set(['ibm_resource_group', 'ibm_is_ssh_key']);

let pieces = {};            // id -> { def, g, t, s }
let layoutN = -1;           // server count the diagram is currently drawn for
let wasBuilt = new Set();   // ids that were built on the previous refresh

function svgEl(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}

/* (Re)draw the whole diagram for n servers. */
function draw(n) {
  const svg = $('#diagram');
  svg.innerHTML = '';
  pieces = {};
  layoutN = n;
  const defs = layout(n);

  // Dotted connector lines go underneath everything else.
  const links = svgEl('g', {}, svg);
  const at = (id) => defs.find((d) => d.id === id);
  const pgw = at('pgw'), sub = at('subnet'), sg = at('sg');
  svgEl('path', { class: 'link', d: `M${pgw.x + pgw.w} ${pgw.y + pgw.h / 2} H${sub.x}` }, links);
  svgEl('path', { class: 'link', d: `M${sg.x + sg.w} ${sg.y + 135} H${sub.x}` }, links);
  for (let i = 0; i < n; i++) {
    const v = at('vsi' + i), f = at('fip' + i);
    svgEl('path', { class: 'link', d: `M${v.x + v.w / 2} ${v.y + v.h} V${f.y}` }, links);
  }

  for (const d of defs) {
    const g = svgEl('g', { class: 'piece', style: `--c: var(${d.color})`, 'data-id': d.id }, svg);
    let t, s;
    if (d.kind === 'box') {
      svgEl('rect', { class: 'box', x: d.x, y: d.y, width: d.w, height: d.h, rx: 10 }, g);
      glyph(g, d.glyph, d.x + 12, d.y + 10, 1);
      t = svgEl('text', { class: 't', x: d.x + 42, y: d.y + 26 }, g);
      s = svgEl('text', { class: 's', x: d.x + 42, y: d.y + 41 }, g);
    } else if (d.mode === 'chip') {
      svgEl('rect', { class: 'card', x: d.x, y: d.y, width: d.w, height: d.h, rx: 8 }, g);
      t = svgEl('text', { class: 't', x: d.x + 14, y: d.y + 20 }, g);
      s = svgEl('text', { class: 's', x: d.x + 14, y: d.y + 35 }, g);
    } else if (d.mode === 'wide') {
      svgEl('rect', { class: 'card', x: d.x, y: d.y, width: d.w, height: d.h, rx: 8 }, g);
      glyph(g, d.glyph, d.x + 12, d.y + d.h / 2 - 12, 1);
      t = svgEl('text', { class: 't', x: d.x + 46, y: d.y + d.h / 2 - 3 }, g);
      s = svgEl('text', { class: 's', x: d.x + 46, y: d.y + d.h / 2 + 13 }, g);
    } else { // tall: icon on top, text underneath
      svgEl('rect', { class: 'card', x: d.x, y: d.y, width: d.w, height: d.h, rx: 8 }, g);
      glyph(g, d.glyph, d.x + 12, d.y + 12, 1.2);
      t = svgEl('text', { class: 't', x: d.x + 12, y: d.y + d.h - 32 }, g);
      s = svgEl('text', { class: 's', x: d.x + 12, y: d.y + d.h - 15 }, g);
    }
    pieces[d.id] = { def: d, g, t, s };
  }
}

function glyph(parent, name, x, y, scale) {
  const g = svgEl('g', { class: 'gl', transform: `translate(${x} ${y}) scale(${scale * 1.0})` }, parent);
  g.innerHTML = GLYPHS[name];
}

/* Shorten text so it fits inside a piece. */
const fit = (text, maxChars) => (text.length <= maxChars ? text : text.slice(0, Math.max(1, maxChars - 1)) + '…');

/* Work out which pieces are built from a state summary and update the picture. */
function render(resources, expectedServers) {
  // Group the summary by resource type: { ibm_is_vpc: [ {name,...} ], ... }
  const byType = {};
  for (const r of resources) {
    if (r.mode === 'data' && !LOOKUP_TYPES.has(r.type)) continue;   // a data source is not something we built
    (byType[r.type] = byType[r.type] || []).push(r);
  }

  // Draw enough server slots for what the code wants AND what already exists.
  const n = Math.max(1, Math.min(8, Math.max(expectedServers, (byType.ibm_is_instance || []).length)));
  if (n !== layoutN) draw(n);

  let built = 0;
  const nowBuilt = new Set();
  for (const id in pieces) {
    const { def, g, t, s } = pieces[id];
    const found = (byType[def.type] || [])[def.i];   // the i-th resource of this type, if any
    const isBuilt = Boolean(found);
    if (isBuilt) { built++; nowBuilt.add(id); }

    g.classList.toggle('built', isBuilt);
    if (isBuilt && !wasBuilt.has(id)) {              // newly built: pulse once
      g.classList.add('pop');
      setTimeout(() => g.classList.remove('pop'), 700);
    }

    // Text: placeholders until built, then the real name from the state.
    const w = def.mode === 'wide' ? def.w - 56 : def.w - 22;
    const chars = Math.floor((def.kind === 'box' ? def.w - 52 : w) / 7);
    // The resource group and public IPs keep their fixed title (the real name is long or repeated).
    const keepTitle = def.id === 'rg' || def.type === 'ibm_is_floating_ip';
    const real = isBuilt && !keepTitle && found.name;
    t.textContent = fit(real || def.title, chars);
    let sub = def.type;
    if (isBuilt && found.profile) sub = found.profile;           // servers show their size
    else if (def.mode === 'chip') sub = 'security rule';
    else if (def.type === 'ibm_is_floating_ip') sub = 'floating ip';
    else if (def.id === 'rg') sub = isBuilt ? 'existing · ' + (found.name || '') : 'existing · looked up';
    s.textContent = fit(sub, Math.floor((def.kind === 'box' ? def.w - 52 : w) / 6.0));
  }
  wasBuilt = nowBuilt;

  const total = Object.keys(pieces).length;
  $('#built').textContent = built;
  $('#total').textContent = total;
  $('#barfill').style.width = (total ? (100 * built) / total : 0) + '%';
}

/* ---- Reading the state --------------------------------------------------- */
let manual = false;   // true after the user loads a file by hand: stop polling

function setStatus(text, cls) {
  const el = $('#status');
  el.textContent = text;
  el.className = 'status ' + (cls || '');
}

async function poll() {
  if (manual) return;
  const version = $('#version').value, workspace = $('#workspace').value;
  try {
    const res = await fetch(`/api/state?version=${version}&workspace=${workspace}`, { cache: 'no-store' });
    const d = await res.json();
    fillWorkspaces(d.workspaces || ['default'], workspace);
    if (d.error) { setStatus('state file is being written…', 'live'); return; }   // keep the last picture
    render(d.resources || [], d.instance_count || 2);
    setStatus(d.found ? 'live · ' + new Date().toLocaleTimeString() : 'no state file yet (nothing applied)', d.found ? 'live' : '');
  } catch (e) {
    setStatus('server not reachable: run  mise run viewer  or load a state file', 'bad');
  }
}

function fillWorkspaces(names, current) {
  const sel = $('#workspace');
  if ([...sel.options].map((o) => o.value).join() === names.join()) return;
  sel.innerHTML = names.map((n) => `<option>${n}</option>`).join('');
  sel.value = names.includes(current) ? current : 'default';
}

/* Load a .tfstate by hand (works even without the server). Same summary as server.py. */
$('#loadbtn').onclick = () => $('#file').click();
$('#file').onchange = async (ev) => {
  const file = ev.target.files[0];
  if (!file) return;
  try {
    const tf = JSON.parse(await file.text());
    const summary = [];
    for (const r of tf.resources || [])
      for (const inst of r.instances || []) {
        const a = inst.attributes || {};
        summary.push({ type: r.type, name: typeof a.name === 'string' ? a.name : null,
                       profile: r.type === 'ibm_is_instance' && typeof a.profile === 'string' ? a.profile : null });
      }
    manual = true;
    render(summary, 2);
    setStatus('showing ' + file.name + ' (not live)', '');
  } catch (e) {
    setStatus('that file is not a Terraform state', 'bad');
  }
};

/* Changing version or workspace goes back to live polling. */
for (const id of ['#version', '#workspace']) $(id).onchange = () => { manual = false; poll(); };

// Allow links like  index.html?version=modules&workspace=eu-de
const params = new URLSearchParams(location.search);
if (params.get('version')) $('#version').value = params.get('version');
if (params.get('workspace')) $('#workspace').innerHTML = `<option>${params.get('workspace')}</option>`;

render([], 2);      // start with every piece outlined
poll();
setInterval(poll, 1500);
</script>
</body>
</html>
